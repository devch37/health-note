spring:
  application:
    name: gumjin-note
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gumjin}
    username: ${DB_USERNAME:gumjin}
    password: ${DB_PASSWORD:gumjin-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  mvc:
    problemdetails:
      enabled: false

server:
  # 신뢰할 수 있는 내부 프록시(루프백·사설망, 예: Next rewrites)가 보낸 X-Forwarded-For만 클라이언트 IP로 쓴다.
  # 로그인 IP 제한이 프록시 IP 하나로 뭉치지 않게 한다. 운영 프록시 구성에 맞춰 재검토한다.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false

app:
  mail-from: "검진노트 <no-reply@gumjin.local>"
  token-secret: ${APP_TOKEN_SECRET:change-me-local-only-0123456789abcdef}

logging:
  level:
    root: INFO
---
spring:
  config:
    activate:
      on-profile: local
springdoc:
  api-docs:
    enabled: true
app:
  # Expo 웹 미리보기(npx expo start --web). 휴대폰 앱(Expo Go)은 브라우저가 아니라 CORS와 무관하다.
  cors-allowed-origins:
    - http://localhost:8081
