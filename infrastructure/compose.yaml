# 로컬 개발용 인프라. 운영 환경에서 사용하지 않는다.
name: gumjin-note

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gumjin
      POSTGRES_USER: gumjin
      POSTGRES_PASSWORD: gumjin-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gumjin -d gumjin"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # 웹 UI / API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
